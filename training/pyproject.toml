[project]
name = "ai-trader-training"
version = "0.1.0"
description = "LightGBM fitting only; all inputs and targets are finalized by Rust"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["train"]
