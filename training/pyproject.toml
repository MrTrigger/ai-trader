[project]
name = "ai-trader-training"
version = "0.1.0"
description = "Model fitting only; all inputs and targets are finalized by Rust"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["blend_stockholm_models", "summarize_stockholm", "train", "train_scalper", "train_stockholm", "train_stockholm_direction", "walk_forward_stockholm", "walk_forward_stockholm_direction"]
