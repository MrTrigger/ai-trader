name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      full: ${{ steps.scope.outputs.full }}
      rust: ${{ steps.scope.outputs.rust }}
      training: ${{ steps.scope.outputs.training }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/ci-scope.sh "$EVENT" "$ACTION" "$BASE" "$HEAD" "$DRAFT" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.rust == 'false') }}
    name: rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation plan
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          RUN_SUITE: ${{ needs.changes.outputs.rust }}
        run: test "$PLAN_RESULT" = success && test "$RUN_SUITE" = true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
      - name: test
        working-directory: service
        run: cargo test --workspace

  training:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.training == 'false') }}
    name: python fitting boundary
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation plan
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          RUN_SUITE: ${{ needs.changes.outputs.training }}
        run: test "$PLAN_RESULT" = success && test "$RUN_SUITE" = true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install fitting dependencies
        run: pip install -e "training[dev]"
      - name: test the Rust-matrix client
        run: pytest -q training
