name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner:
    name: planner (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        working-directory: planner
        run: pip install -e ".[dev]"
      - name: test
        working-directory: planner
        run: pytest -q

  contract:
    name: plan contract (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
      - name: test
        working-directory: service
        run: cargo test --all

  # The seam. Python regenerates the fixture from current code and Rust must
  # parse it — so neither half of the contract can move without the other.
  # A green planner job and a green contract job do not prove they agree; only
  # this does.
  cross_language:
    name: cross-language contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
      - name: install planner
        working-directory: planner
        run: pip install -e ".[dev]"
      - name: regenerate the fixture from current python
        working-directory: planner
        env:
          AI_TRADER_UPDATE_FIXTURE: "1"
        run: pytest tests/test_fixture.py -q
      - name: fail if the committed fixture was stale
        run: |
          if ! git diff --quiet -- service/crates/plan/tests/fixtures/plan.json; then
            echo "::error::The committed fixture does not match what the planner produces."
            echo "Regenerate locally with: AI_TRADER_UPDATE_FIXTURE=1 pytest tests/test_fixture.py"
            git --no-pager diff -- service/crates/plan/tests/fixtures/plan.json
            exit 1
          fi
      - name: rust must parse what python wrote
        working-directory: service
        run: cargo test -p plan --test roundtrip
