name: paper-image
on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "config/default.toml"
      - "deploy/**"
      - ".github/workflows/image.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The frozen model artefact is gitignored (data/), so CI rebuilds it from
      # nothing... no - it cannot. It ships as a release asset? Simplest honest
      # path: the artefact is small (2.8MB) and IS the deployable strategy, so
      # it is force-added to the repo. See the commit that added it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/mrtrigger/aitrader-paper:latest
            ghcr.io/mrtrigger/aitrader-paper:${{ github.sha }}
