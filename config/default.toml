[meta]
ruleset_version = "phase0"

[portfolio]
quote_currency = "USD"
interval_s = 86400
target_gross_exposure = "0.80"
# equal_weight is the baseline every constructor must beat; conviction_tilt
# and inverse_vol are the candidates. Compared, not argued about (4.5).
constructor = "conviction_tilt"

# Back to the Phase 0 placeholder, which claims no edge and says so on every
# plan it emits. TWO candidates have now failed the Phase 1 gate and neither may
# be named here: `xs_momentum` and `gc_breakout`. See docs/phase-1-findings.md.
#
# This field naming a signal that failed its gate would be the softest possible
# version of shipping it.
signal = "placeholder_equal_long"

# How many names the signal holds. Distinct from limits.max_position_count,
# which is a hard risk limit: this is what the strategy intends, that is what it
# may not exceed.
max_holdings = 10

# Below this many rankable assets a cross-sectional signal declines to rank.
# "Top 10 of 11" is holding almost everything and calling it a signal.
min_cross_section = 15

# Intervals between decisions. Weekly on daily bars: the horizon is
# hours-to-weeks, and every rebalance costs spread. Swept, not assumed (10.3).
rebalance_every = 7

# Superseded by `ai-trader universe rank`, which ranks by trailing liquidity
# from the bar store and records a point-in-time snapshot per decision date.
# Kept only for `universe record`, the Phase 0 configured-list path.
universe = ["BTC", "ETH", "SOL"]

# What portfolio beta is measured against (spec 6.2). BTC for crypto, SPY for
# equities later - same code, different benchmark. It does not have to be in the
# universe: it is featurized either way, because it is the yardstick and not a
# holding.
benchmark = "BTC"

# Eligibility floor: below this median daily quote turnover an asset is not
# tradeable at our size regardless of what its signal says.
#
# A SCREEN, not a selector. Selection is the liquidity rank in
# `universe rank`; this only removes what could not be traded. The Phase 0
# value of 50M was chosen when the universe was three configured names, and as
# a screen over a ranked universe it silently became the selector: in 2026 only
# 8 assets cleared it, which would have collapsed the cross-section below
# `min_cross_section` and left the book flat for a whole period.
#
# 5M against a 10-name book of ~$10k positions is two orders of magnitude of
# headroom, which is what a screen should be.
min_dollar_volume = "5000000"

# Below this annualised realised volatility an asset is a peg, not a position.
# Behavioural rather than a maintained name list - a new stablecoin should not
# need a config change to be recognised, and nothing genuinely risky in crypto
# sits near zero vol.
min_volatility = "0.10"

# An asset with less history than this cannot have its features computed
# honestly, so it is ineligible rather than silently carrying nulls.
min_history_bars = 90

# Rebalance deadband: skip a trade whose weight drift is worth less than this
# multiple of its estimated round-trip cost. Prevents paying spread to correct
# noise. Costs enter a constructor's *objective* only when the constructor has
# one - equal_weight does not, so this is where they bind today.
rebalance_cost_multiple = "3.0"

# Turnover budget per run, as a fraction of NAV. A BUDGET, not a limit: it paces
# the transition rather than vetoing the destination. Trades are taken in
# priority order until it is spent, and whatever is dropped is disclosed on the
# plan (never silently truncated).
#
# It lives here and not in [limits] because gross exposure, position size and
# count are properties of the resulting PORTFOLIO, while turnover is a property
# of the TRANSITION. Mixing the two made an initial build from flat impossible
# to accept: going 0% -> 75% invested simply IS 75% turnover.
#
# Exits are exempt and are never dropped - a position we no longer want is risk
# we are still carrying, and pacing out of it is not a saving.
turnover_budget = "0.50"

[limits]
# Properties of the RESULTING portfolio. Breaching any one rejects the plan
# whole - never partially applied, never truncated to fit. Turnover is not here;
# see turnover_budget above.
max_gross_exposure = "1.00"
max_position = "0.25"
max_position_count = 12
min_position_notional = "25"

# Gross exposure per correlated group. NOT OPTIONAL per spec 6: a hundred crypto
# assets are approximately one asset, and an equal-weight book across them is a
# leveraged beta bet wearing a diversification costume.
#
# 0.40 is ASSERTED, not derived. It allows at most two max-size positions in one
# group, which forces a book to span at least two groups before it can reach the
# gross target. Phase 1's sweep is where a number like this earns its value, and
# until then it is a judgement recorded rather than a result.
max_cluster_exposure = "0.40"

# |w'beta| against `benchmark`.
#
# Was 1.00, which turned out to be pathological: a long-only book at 0.80 gross
# holding ~1.25-beta alts sits at ~1.00 exactly, so the limit rejected 101 of
# 253 plans by a typical margin of 0.07% - vetoing on rounding noise rather
# than on risk. See docs/phase-1-findings.md. The Phase 1 result was invariant
# to this number, so raising it is a correction and not a softened gate.
#
# The deeper point, worth keeping: for a LONG-ONLY book this limit is close to
# a restatement of max_gross_exposure. Its value arrives with shorts, which is
# also when max_net_exposure starts to mean something.
#
# An asset whose beta cannot be estimated is assumed to be 1.0, which can only
# tighten this. See risk.UNKNOWN_BETA.
max_benchmark_beta = "1.25"

# Not enforced yet. Left explicitly null rather than set to a permissive number,
# so the run discloses it as unenforced instead of implying it passed.
#   max_net_exposure - needs shorts to be meaningful
max_net_exposure = ""

# Correlated groups, for max_cluster_exposure above. Crude and present beats
# sophisticated and Phase 5: this is a hand-maintained sector map, not a
# correlation clustering, and it is expected to be replaced by one.
#
# An asset named here belongs to exactly one group - being in two makes the
# exposure sums lie, and config loading refuses it. An asset named in NO group
# is not constrained by the limit at all, and the plan says so by name rather
# than absorbing it quietly.
[clusters]
btc = ["BTC"]
eth = ["ETH"]
alt_l1 = ["SOL", "AVAX", "NEAR", "ADA", "DOT", "SUI", "APT"]
l2 = ["ARB", "OP", "MATIC", "STRK"]
defi = ["UNI", "AAVE", "LINK", "MKR", "CRV"]

[costs]
# Taker fee, roughly the level both candidate venues charge.
commission_bps = "5.0"
# Half-spread crossed on entry. A placeholder for liquid majors; per-asset
# estimation from real quotes is Phase 1.
spread_bps = "2.0"
# Impact coefficient. UNCALIBRATED - see CostModel. Phase 3 compares realised
# against estimated and this is the number that moves.
impact_coefficient = "0.10"
adv_lookback_days = 20
calibrated = false
