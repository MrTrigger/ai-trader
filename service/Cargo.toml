[workspace]
resolver = "2"
members = ["crates/plan", "crates/records", "crates/venue", "crates/paper", "crates/executor", "crates/runner", "crates/hyperliquid", "crates/bot", "crates/api", "crates/viewer", "crates/features-common", "crates/features-cme", "crates/features-crypto", "crates/features-stockholm", "crates/equity-data", "crates/cme-data", "crates/lightgbm-json", "crates/portfolio-construction", "crates/stockholm-portfolio", "crates/crypto-portfolio", "crates/noise-book", "crates/ib", "crates/rithmic", "crates/futures-bot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
plan = { path = "crates/plan" }
venue = { path = "crates/venue" }
paper = { path = "crates/paper" }
executor = { path = "crates/executor" }
runner = { path = "crates/runner" }
hyperliquid = { path = "crates/hyperliquid" }
features-cme = { path = "crates/features-cme" }
features-crypto = { path = "crates/features-crypto" }
features-common = { path = "crates/features-common" }
features-stockholm = { path = "crates/features-stockholm" }
equity-data = { path = "crates/equity-data" }
cme-data = { path = "crates/cme-data" }
lightgbm-json = { path = "crates/lightgbm-json" }
portfolio-construction = { path = "crates/portfolio-construction" }
stockholm-portfolio = { path = "crates/stockholm-portfolio" }
crypto-portfolio = { path = "crates/crypto-portfolio" }
noise-book = { path = "crates/noise-book" }
async-trait = "0.1"
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "parsing"] }
uuid = { version = "1", features = ["serde", "v5"] }
