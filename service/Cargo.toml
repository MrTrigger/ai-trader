[workspace]
resolver = "2"
members = ["crates/plan", "crates/records", "crates/venue", "crates/paper", "crates/executor", "crates/runner", "crates/hyperliquid", "crates/bot", "crates/api", "crates/viewer", "crates/features-cme", "crates/noise-book", "crates/ib", "crates/futures-bot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
plan = { path = "crates/plan" }
venue = { path = "crates/venue" }
paper = { path = "crates/paper" }
executor = { path = "crates/executor" }
runner = { path = "crates/runner" }
hyperliquid = { path = "crates/hyperliquid" }
features-cme = { path = "crates/features-cme" }
noise-book = { path = "crates/noise-book" }
async-trait = "0.1"
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "parsing"] }
uuid = { version = "1", features = ["serde"] }
