[package]
name = "hyperliquid"
description = "The Hyperliquid venue adapter: a public read path that needs no credentials, and a trade path that signs with an agent wallet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
plan.workspace = true
venue.workspace = true
async-trait.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time", "rt", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# EIP-712 by hand rather than a web3 stack. Signing one well-known typed
# structure needs a curve and a hash; pulling in a whole Ethereum client to get
# them would add a provider, an ABI coder and an RPC layer this never calls.
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rmp-serde = "1"
# Default features kept: "connect" and "handshake" are both needed
# (connect_async and, in tests, accept_async).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
