<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriggerTrader — Operations</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* ── TriggerTrader · night radar ─────────────────────────────────────────
     One operator, several bots, real money. The ground is a blue-black the
     eye can sit in for hours; the brand is radar cyan and appears only where
     attention should go (the mark, the active tab, focus, the live endpoint
     of a curve). Money keeps its own colours — green up, red down, amber
     caution — and the brand never borrows them.

     Identity is mono-forward: every number tabular, the wordmark and hero
     figures set in the mono face. A terminal being honest about being a
     terminal, not a brochure about one. */
  :root {
    --bg:    #0B0F14;
    --srf:   #10161E;
    --srf2:  #161E28;
    --line:  #1D2836;
    --line2: #2A3848;
    --ink:   #E8EDF4;
    --ink2:  #9DA9BA;
    --ink3:  #5E6B7E;
    --brand: #53C6E8;
    --up:    #3DCE8C;
    --down:  #F0655D;
    --warn:  #E7A94C;
    /* Per-bot series colours, assigned by registry order, never cycled. The
       combined line is ink-white: white is the whole operation, colour is a
       component. */
    --b1: #53C6E8; --b2: #9D8CFF; --b3: #E08BD0; --b4: #6ED3B0;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --r: 12px;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font-family: var(--sans);
    font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(83,198,232,.28); }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ── chrome ── */
  .topbar {
    display: flex; align-items: center; gap: 22px;
    padding: 0 22px; height: 54px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
  }
  .wordmark { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .wordmark svg { display: block; }
  .wordmark .wm {
    font-family: var(--mono); font-size: 12.5px; letter-spacing: .22em;
    color: var(--ink); white-space: nowrap;
  }
  .wordmark .wm b { font-weight: 700; }
  .wordmark .wm span { font-weight: 300; color: var(--ink2); }
  .wordmark:hover { text-decoration: none; }

  nav.tabs { display: flex; gap: 2px; align-items: stretch; height: 100%; overflow-x: auto; }
  nav.tabs a {
    display: flex; align-items: center; gap: 7px; padding: 0 13px;
    font-size: 12.5px; color: var(--ink2); border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav.tabs a:hover { color: var(--ink); text-decoration: none; }
  nav.tabs a.on { color: var(--ink); border-bottom-color: var(--brand); }
  nav.tabs a .lamp { width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); }
  nav.tabs a .lamp.ok { background: var(--up); }
  nav.tabs a .lamp.warn { background: var(--warn); }
  nav.tabs a .lamp.bad { background: var(--down); }

  .topmeta { margin-left: auto; display: flex; align-items: center; gap: 14px;
             font-family: var(--mono); font-size: 11px; color: var(--ink3); white-space: nowrap; }
  /* On a phone the clock is decoration; the tabs are navigation. */
  @media (max-width: 720px) { .topmeta { display: none; } .topbar { gap: 12px; } }
  .dbchip { display: inline-flex; align-items: center; gap: 6px; }
  .dbchip i { width: 6px; height: 6px; border-radius: 50%; background: var(--up); display: inline-block; }
  .dbchip.off i { background: var(--down); }

  .shell { max-width: 1460px; margin: 0 auto; padding: 20px 22px 72px; }

  /* ── cards ── */
  .card { background: var(--srf); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
  .card > header { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 0; }
  .eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink3); font-weight: 600; white-space: nowrap;
  }
  .card > header .sub { font-size: 11.5px; color: var(--ink3); }
  .card .pad { padding: 14px 16px 16px; overflow-x: auto; }
  .card .pad.tight { padding: 10px 16px 14px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line2); color: var(--ink2); background: var(--srf2);
    white-space: nowrap;
  }
  .pill.up   { color: var(--up);   border-color: color-mix(in srgb, var(--up) 40%, transparent); }
  .pill.down { color: var(--down); border-color: color-mix(in srgb, var(--down) 40%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .pill.brand{ color: var(--brand);border-color: color-mix(in srgb, var(--brand) 40%, transparent); }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); display: inline-block; flex: 0 0 auto; }
  .dot.ok   { background: var(--up);   box-shadow: 0 0 0 4px color-mix(in srgb, var(--up) 14%, transparent); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 14%, transparent); }
  .dot.bad  { background: var(--down); box-shadow: 0 0 0 4px color-mix(in srgb, var(--down) 14%, transparent); }

  .u-up { color: var(--up); } .u-down { color: var(--down); }
  .u-warn { color: var(--warn); } .u-dim { color: var(--ink3); } .u-mid { color: var(--ink2); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ── fleet hero ── */
  .hero { position: relative; overflow: hidden; }
  .hero .reticle-bg {
    position: absolute; right: -70px; top: -70px; width: 360px; height: 360px;
    opacity: .05; pointer-events: none;
  }
  .hero-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px 40px; padding: 20px 20px 8px; }
  .hero-amount {
    font-family: var(--mono); font-weight: 500; font-size: 46px;
    letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; margin-top: 8px;
  }
  .hero-amount .cents { font-size: 26px; color: var(--ink3); }
  .hero-delta { font-family: var(--mono); font-size: 12.5px; margin-top: 8px; }
  .hero-stats { margin-left: auto; display: flex; gap: 34px; flex-wrap: wrap; }
  .hero-stats .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
                   color: var(--ink3); font-family: var(--mono); font-weight: 600; }
  .hero-stats .v { font-family: var(--mono); font-size: 19px; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .hero-stats > div { text-align: right; }

  .chartwrap { position: relative; padding: 4px 10px 0; }
  .chartwrap svg { display: block; width: 100%; }
  .gridline { stroke: var(--line); stroke-width: 1; }
  .zeroline { stroke: var(--line2); stroke-width: 1; stroke-dasharray: 2 4; }
  .axis { fill: var(--ink3); font-family: var(--mono); font-size: 9.5px; }
  .crosshair { stroke: var(--ink3); stroke-width: 1; stroke-dasharray: 3 3; }
  .tip {
    position: absolute; pointer-events: none; background: var(--srf2);
    border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px;
    font-family: var(--mono); font-size: 11px; white-space: nowrap; z-index: 5;
    box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  .tip .trow { display: flex; gap: 12px; justify-content: space-between; }
  .tip .trow i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; margin-right: 5px; }
  .chartfoot { display: flex; align-items: center; gap: 8px; padding: 6px 16px 14px; flex-wrap: wrap; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; }
  .legend .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; color: var(--ink2);
    background: var(--srf2); border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px;
  }
  .legend .chip i { width: 8px; height: 8px; border-radius: 2px; }
  .legend .chip.off { opacity: .38; }
  .range { display: flex; gap: 4px; margin-left: auto; }
  .range button {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
    padding: 3px 10px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: var(--ink3); cursor: pointer;
  }
  .range button.on { background: var(--srf2); border-color: var(--line2); color: var(--ink); }
  .chartnote { font-size: 11px; color: var(--ink3); }

  /* ── fleet grid ── */
  .fleetgrid { display: grid; gap: 16px; grid-template-columns: 1fr; margin-top: 16px; }
  @media (min-width: 1080px) { .fleetgrid { grid-template-columns: minmax(0,1fr) 340px; } }
  .botcards { display: grid; gap: 14px; grid-template-columns: 1fr; align-content: start; }
  @media (min-width: 720px) { .botcards { grid-template-columns: 1fr 1fr; } }

  .botcard { display: block; color: inherit; position: relative; cursor: pointer;
             transition: border-color .15s ease, transform .15s ease; }
  .botcard:hover { text-decoration: none; border-color: var(--line2); transform: translateY(-1px); }
  .botcard .head { display: flex; align-items: center; gap: 9px; padding: 14px 16px 0; }
  .botcard .head .name { font-weight: 650; font-size: 14.5px; letter-spacing: .01em; }
  .botcard .head .pill { margin-left: auto; }
  .botcard .meta { padding: 3px 16px 0; font-size: 11.5px; color: var(--ink3); }
  .botcard .spark { padding: 10px 10px 0; }
  .botcard .spark svg { display: block; width: 100%; height: 46px; }
  .botcard .vitals { display: flex; gap: 22px; padding: 10px 16px 14px; flex-wrap: wrap; }
  .botcard .vitals .k { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
                        color: var(--ink3); font-family: var(--mono); font-weight: 600; }
  .botcard .vitals .v { font-family: var(--mono); font-size: 13.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .botcard .open {
    position: absolute; right: 14px; bottom: 12px; font-family: var(--mono);
    font-size: 10.5px; letter-spacing: .08em; color: var(--ink3);
  }
  .botcard:hover .open { color: var(--brand); }

  /* ── feed ── */
  .feed { display: flex; flex-direction: column; max-height: 560px; overflow-y: auto; }
  .feed .row { display: flex; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .feed .row:last-child { border-bottom: none; }
  .feed .at { font-family: var(--mono); font-size: 10.5px; color: var(--ink3); flex: 0 0 76px; padding-top: 2px; }
  .feed .who { flex: 0 0 auto; }
  .feed .who i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; margin-top: 5px; }
  .feed .what { color: var(--ink2); min-width: 0; overflow-wrap: anywhere; }
  .feed .what b { color: var(--ink); font-weight: 600; }
  .feed .row.bad .what { color: var(--down); }
  .feed .row.warn .what { color: var(--warn); }

  /* ── bot page scaffold ── */
  .bothead { display: flex; align-items: center; gap: 14px; margin: 2px 0 16px; flex-wrap: wrap; }
  .bothead .back { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--ink3); }
  .bothead .back:hover { color: var(--brand); text-decoration: none; }
  .bothead h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: .01em; }
  .bothead .sub { color: var(--ink3); font-size: 12px; }
  .botgrid { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 1180px) { .botgrid { grid-template-columns: minmax(0,1fr) 330px; } }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  /* ── tables ── */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink3); font-weight: 600; padding: 9px 16px; white-space: nowrap;
    border-bottom: 1px solid var(--line); font-family: var(--mono);
  }
  td { padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255,255,255,.015); }
  td.num, th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .sym { font-family: var(--mono); font-weight: 600; }
  .time { font-family: var(--mono); font-size: 11px; color: var(--ink3); white-space: nowrap; }
  .wrapcell { min-width: 230px; color: var(--ink2); font-size: 12px; }
  .ellipsis { font-family: var(--mono); font-size: 11px; color: var(--ink3);
              max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-l { color: var(--up); font-family: var(--mono); font-weight: 600; }
  .side-s { color: var(--down); font-family: var(--mono); font-weight: 600; }
  tr.out-executed  td:first-child { box-shadow: inset 2px 0 0 var(--up); }
  tr.out-partial   td:first-child { box-shadow: inset 2px 0 0 var(--warn); }
  tr.out-halted    td:first-child { box-shadow: inset 2px 0 0 var(--down); }
  tr.out-refused   td:first-child { box-shadow: inset 2px 0 0 var(--ink3); }
  tr.out-flattened td:first-child { box-shadow: inset 2px 0 0 var(--brand); }
  tr.out-adopted   td:first-child { box-shadow: inset 2px 0 0 var(--b2); }
  tr.out-mode-changed td:first-child { box-shadow: inset 2px 0 0 var(--b3); }

  .expo { position: relative; height: 7px; width: 150px; background: var(--srf2); border-radius: 3px; }
  .expo::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; border-left: 1px solid var(--line2); }
  .expo i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .expo i.l { left: 50%; background: var(--b1); }
  .expo i.s { right: 50%; background: var(--down); }

  /* ── meters / kv / inputs ── */
  .meter { margin-bottom: 13px; }
  .meter:last-child { margin-bottom: 0; }
  .meter .row { display: flex; align-items: baseline; gap: 8px; }
  .meter .name { font-size: 12.5px; }
  .meter .val { margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .meter .val .lim { color: var(--ink3); }
  .meter .track { height: 5px; background: var(--srf2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .meter .track i { display: block; height: 100%; border-radius: 3px; background: var(--up); }
  .meter.mid .track i { background: var(--warn); }
  .meter.high .track i { background: var(--down); }
  .meter .foot { font-size: 11px; color: var(--ink3); margin-top: 5px; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 12.5px; }
  .kv dt { color: var(--ink3); }
  .kv dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  label { display: block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
          color: var(--ink3); font-weight: 600; margin-bottom: 5px; font-family: var(--mono); }
  input[type=text] {
    width: 100%; padding: 8px 10px; font-family: var(--sans); font-size: 13px;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line2); border-radius: 8px;
  }
  input[type=text]::placeholder { color: var(--ink3); }
  .field { margin-bottom: 10px; }
  .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btnrow.one { grid-template-columns: 1fr; }
  button.ctl {
    font-family: var(--sans); font-size: 13px; font-weight: 570; cursor: pointer;
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line2);
    background: var(--srf2); color: var(--ink);
  }
  button.ctl:hover:not([disabled]) { border-color: var(--ink3); }
  button.ctl.kill { color: var(--down); border-color: color-mix(in srgb, var(--down) 38%, transparent);
                    background: color-mix(in srgb, var(--down) 9%, var(--srf)); }
  button.ctl.go   { color: var(--up); border-color: color-mix(in srgb, var(--up) 38%, transparent);
                    background: color-mix(in srgb, var(--up) 9%, var(--srf)); }
  button.ctl[disabled] { opacity: .4; cursor: not-allowed; }
  .ctlnote { font-size: 11px; color: var(--ink3); margin: 8px 0 0; line-height: 1.55; }
  .ctlsplit { border-top: 1px solid var(--line); margin: 13px 0 0; padding-top: 13px; }
  .result { margin-top: 10px; font-size: 12px; overflow-wrap: anywhere; }
  pre.cmd {
    font-family: var(--mono); font-size: 11px; background: var(--bg); color: var(--ink2);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    margin: 8px 0 0; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
         background: var(--bg); border: 1px solid var(--line2); border-radius: 9px; padding: 3px; }
  .seg button {
    font-family: var(--sans); font-size: 11.5px; font-weight: 570; cursor: pointer;
    padding: 6px 4px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: var(--ink3); white-space: nowrap;
  }
  .seg button:hover:not([disabled]):not(.on) { color: var(--ink2); }
  .seg button.on { background: var(--srf2); border-color: var(--line2); color: var(--ink); }
  .seg button.live { color: var(--down); }
  .seg button.live.on { background: color-mix(in srgb, var(--down) 12%, var(--srf));
                        border-color: color-mix(in srgb, var(--down) 42%, transparent); color: var(--down); }
  .seg button[disabled] { opacity: .45; cursor: not-allowed; }
  .card.livemode { border-color: color-mix(in srgb, var(--down) 45%, transparent); }
  .card.livemode > header .eyebrow { color: var(--down); }
  .card.alarm { border-color: color-mix(in srgb, var(--down) 40%, transparent); }
  .card.alarm > header .eyebrow { color: var(--down); }

  .banner {
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    background: color-mix(in srgb, var(--warn) 7%, var(--srf));
    border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px;
  }
  .banner .t { font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
               text-transform: uppercase; color: var(--warn); font-weight: 700; }
  .banner ul { margin: 8px 0 0; padding-left: 18px; }
  .banner li { color: var(--ink2); font-size: 12.5px; margin-bottom: 5px; }

  /* ── sleeves (futures) ── */
  .sleeves { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .sleeves { grid-template-columns: 1fr 1fr; } }
  .sleeve { background: var(--srf2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .sleeve .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sleeve .top .nm { font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: .04em; }
  .sleeve .top .pill { margin-left: auto; }
  .sleeve .stats { display: flex; gap: 20px; margin-top: 9px; flex-wrap: wrap; }
  .sleeve .stats .k { font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
                      color: var(--ink3); font-family: var(--mono); font-weight: 600; }
  .sleeve .stats .v { font-family: var(--mono); font-size: 13px; margin-top: 2px; }

  .empty { color: var(--ink3); font-size: 12.5px; padding: 16px; }
  .empty .hint { font-size: 11.5px; margin-top: 4px; }
  .loading { color: var(--ink3); font-family: var(--mono); font-size: 12px; padding: 40px; text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <a class="wordmark" href="#/" aria-label="TriggerTrader fleet">
    <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
      <g stroke="var(--brand)" stroke-width="2.4" fill="none" stroke-linecap="round">
        <circle cx="16" cy="16" r="7.5"/>
        <path d="M16 3.5v5M16 23.5v5M3.5 16h5M23.5 16h5"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="var(--brand)"/>
    </svg>
    <span class="wm"><b>TRIGGER</b><span>TRADER</span></span>
  </a>
  <nav class="tabs" id="tabs" aria-label="bots"></nav>
  <div class="topmeta">
    <span class="dbchip" id="dbchip"><i></i><span id="dbchiptext">registry</span></span>
    <span id="clockel"></span>
  </div>
</div>

<div class="shell" id="view"><div class="loading">connecting…</div></div>

<script>
"use strict";

/* ── utilities ─────────────────────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const num = (v) => Number(String(v ?? "").replace(/,/g, ""));
const fmt = (v, dp = 2) => {
  const n = num(v);
  return Number.isFinite(n)
    ? n.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp })
    : "—";
};
const money = (v) => {
  const n = num(v);
  if (!Number.isFinite(n)) return "—";
  return (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const signedMoney = (v) => (num(v) > 0 ? "+" : "") + money(v);
const pct = (v, dp = 1) => {
  const n = num(v);
  if (!Number.isFinite(n)) return "—";
  return (Math.abs(n) * 100 < 0.05 ? 0 : n * 100).toFixed(dp) + "%";
};
const cls = (v) => (num(v) > 0 ? "u-up" : num(v) < 0 ? "u-down" : "u-mid");
const stampOf = (iso) => (iso ? String(iso).replace("T", " ").replace(/(\.\d+)?(Z|\+00:00)$/, "") : "—");
const hhmm = (iso) => { const s = String(iso ?? ""); return s.length >= 16 ? s.slice(11, 16) : "—"; };
const ago = (secs) => {
  if (secs == null || !Number.isFinite(Number(secs))) return "—";
  secs = Number(secs);
  if (secs < 90) return Math.round(secs) + "s";
  if (secs < 5400) return Math.round(secs / 60) + "m";
  if (secs < 129600) return (secs / 3600).toFixed(1) + "h";
  return Math.round(secs / 86400) + "d";
};
const BOTCOLORS = ["var(--b1)", "var(--b2)", "var(--b3)", "var(--b4)"];

/* ── data layer ────────────────────────────────────────────────────────── */
const model = {
  overview: null,     // /api/fleet/overview
  local: null,        // /api/state — the wrapped runner bot's book, if any
  details: {},        // bot_id -> /api/bots/<id>/state
  hidden: new Set(),  // legend toggles
  range: "ALL",
};
const botColor = (id) => {
  const bots = model.overview?.bots || [];
  const i = bots.findIndex((b) => b.bot_id === id);
  return BOTCOLORS[(i < 0 ? 0 : i) % BOTCOLORS.length];
};
const botOf = (id) => (model.overview?.bots || []).find((b) => b.bot_id === id);

async function getJSON(url) {
  const r = await fetch(url, { headers: { accept: "application/json" } });
  if (!r.ok) throw new Error("HTTP " + r.status + " on " + url);
  return r.json();
}
async function refreshData() {
  model.overview = await getJSON("/api/fleet/overview")
    .catch((e) => ({ available: false, reason: String(e) }));
  try {
    const st = await getJSON("/api/state");
    model.local = st.fleet_only ? null : st;
  } catch { model.local = null; }
  const id = routeBotId();
  if (id) {
    try { model.details[id] = await getJSON("/api/bots/" + encodeURIComponent(id) + "/state"); }
    catch (e) { model.details[id] = { error: String(e) }; }
  }
}

/* ── router ────────────────────────────────────────────────────────────── */
function routeBotId() {
  const m = location.hash.match(/^#\/bot\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}
async function navigate() {
  await refreshData();
  render();
}
window.addEventListener("hashchange", () => {
  $("view").innerHTML = '<div class="loading">loading…</div>';
  navigate();
});

function render() {
  // A re-render must never eat what the operator typed or the answer they
  // just got: refresh is background noise, their form is not.
  const keep = {
    who: $("who")?.value, why: $("why")?.value,
    result: $("ctlresult")?.innerHTML,
  };
  renderChrome();
  const id = routeBotId();
  if (!id) { renderFleet(); }
  else {
    const bot = botOf(id);
    const detail = model.details[id] || {};
    if (detail.contract === "botstate") renderFutures(id, detail);
    else if (bot?.local && model.local) renderRunnerConsole(id, bot);
    else renderRunnerRemote(id, bot, detail);
  }
  if (keep.who && $("who")) $("who").value = keep.who;
  if (keep.why && $("why")) $("why").value = keep.why;
  if (keep.result && $("ctlresult") && !$("ctlresult").innerHTML) $("ctlresult").innerHTML = keep.result;
}

function renderChrome() {
  const ov = model.overview || {};
  const bots = ov.bots || [];
  const cur = routeBotId();
  $("tabs").innerHTML =
    '<a href="#/" class="' + (cur ? "" : "on") + '">FLEET</a>' +
    bots.map((b) => {
      const st = b.status || {};
      const stale = (st.heartbeat_age_seconds ?? 0) > 900;
      const halted = st.kill_switch === true || !!st.halted;
      const lamp = !b.enabled ? "" : halted ? "bad" : stale && st.contract === "botstate" ? "warn" : "ok";
      return '<a href="#/bot/' + encodeURIComponent(b.bot_id) + '" class="' + (cur === b.bot_id ? "on" : "") + '">' +
        '<span class="lamp ' + lamp + '"></span>' + esc(b.bot_id) + "</a>";
    }).join("");
  const okDb = ov.available !== false;
  $("dbchip").className = "dbchip" + (okDb ? "" : " off");
  $("dbchiptext").textContent = okDb ? "registry" : "registry down";
  $("clockel").textContent = new Date().toISOString().slice(0, 16).replace("T", " ") + "Z";
}

/* ── charts ────────────────────────────────────────────────────────────── */
function niceScale(lo, hi, n = 4) {
  if (!(hi > lo)) { const v = hi || 1; return [v - 1, v + 1, [v - 1, v, v + 1]]; }
  const pad = (hi - lo) * 0.08;
  const raw = (hi - lo + 2 * pad) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].find((m) => m * mag >= raw) * mag;
  const y0 = Math.floor((lo - pad) / step) * step;
  const y1 = Math.ceil((hi + pad) / step) * step;
  const ticks = [];
  for (let t = y0; t <= y1 + step / 2; t += step) ticks.push(t);
  return [y0, y1, ticks];
}

/* The fleet series: every bot rebased to P&L, step-summed into one combined
   line, with the combined drawdown drawn as an underwater band on its own
   small axis below. White is the whole operation; colour is a component. */
function fleetSeries() {
  const bots = (model.overview?.bots || []).filter((b) => (b.series || []).length);
  const per = bots.map((b) => {
    let pts = b.series.map(([t, v]) => ({ t: String(t), v: num(v) })).filter((p) => Number.isFinite(p.v));
    if (b.series_kind === "nav" && pts.length) {
      const base = pts[0].v;
      pts = pts.map((p) => ({ t: p.t, v: p.v - base }));
    }
    return { id: b.bot_id, pts };
  }).filter((s) => s.pts.length);

  const cut = { "1W": 7 * 864e5, "1M": 30 * 864e5 }[model.range];
  if (cut) {
    const min = Date.now() - cut;
    for (const s of per) s.pts = s.pts.filter((p) => { const ms = Date.parse(p.t); return !Number.isFinite(ms) || ms >= min; });
  }

  const shown = per.filter((s) => !model.hidden.has(s.id) && s.pts.length);
  const stamps = [...new Set(shown.flatMap((s) => s.pts.map((p) => p.t)))].sort();
  const combined = stamps.map((t) => {
    let sum = 0;
    for (const s of shown) {
      let last = 0;
      for (const p of s.pts) { if (p.t <= t) last = p.v; else break; }
      sum += last;
    }
    return { t, v: sum };
  });
  let peak = -Infinity;
  const dd = combined.map((p) => { peak = Math.max(peak, p.v); return { t: p.t, v: p.v - peak }; });
  return { per: shown, combined, dd };
}

function drawFleetChart(el) {
  const { per, combined, dd } = fleetSeries();
  if (combined.length < 2) {
    el.innerHTML = '<div class="empty">Not enough history for a curve yet.' +
      '<div class="hint">Every completed run adds a point — the first few cycles will draw this.</div></div>';
    return;
  }
  const W = Math.max(el.clientWidth || 1000, 360);
  const H = 306, PADL = 64, PADR = 16, PADT = 14, DDH = 52, GAP = 26, PADB = 24;
  const mainB = H - PADB - DDH - GAP;
  const xs = combined.map((p) => p.t);
  const x = (i) => PADL + (i / Math.max(xs.length - 1, 1)) * (W - PADL - PADR);
  const xOf = (t) => { const i = xs.indexOf(t); return x(i < 0 ? 0 : i); };

  const allVals = combined.map((p) => p.v).concat(per.flatMap((s) => s.pts.map((p) => p.v)), [0]);
  const [y0, y1, ticks] = niceScale(Math.min(...allVals), Math.max(...allVals));
  const y = (v) => PADT + (1 - (v - y0) / (y1 - y0)) * (mainB - PADT);

  const ddMin = Math.min(...dd.map((p) => p.v), -1);
  const ddY = (v) => (H - PADB - DDH) + (v / ddMin) * DDH;

  // Step interpolation: equity only changes when a run lands, and a slope
  // between two runs would invent motion nothing recorded.
  const stepPath = (pts, yf, xf) => {
    let d = "";
    pts.forEach((p, i) => {
      const X = xf(p.t).toFixed(1), Y = yf(p.v).toFixed(1);
      d += i === 0 ? `M${X} ${Y}` : `H${X}V${Y}`;
    });
    return d;
  };

  const grid = ticks.map((t) =>
    `<line class="gridline" x1="${PADL}" x2="${W - PADR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"></line>` +
    `<text class="axis" x="${PADL - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${fmt(t, 0)}</text>`).join("");

  const perPaths = per.map((s) =>
    `<path d="${stepPath(s.pts, y, xOf)}" fill="none" stroke="${botColor(s.id)}" stroke-width="1.4" opacity=".85"></path>`).join("");

  const combPath = stepPath(combined, y, xOf);
  const last = combined[combined.length - 1];

  let ddPath = `M${x(0).toFixed(1)} ${ddY(0).toFixed(1)}`;
  dd.forEach((p, i) => { ddPath += `H${x(i).toFixed(1)}V${ddY(p.v).toFixed(1)}`; });
  ddPath += `H${x(xs.length - 1).toFixed(1)}V${ddY(0).toFixed(1)}Z`;
  const ddWorst = Math.min(...dd.map((p) => p.v));

  const first = combined[0].t, lastT = last.t;
  const sameDay = String(first).slice(0, 10) === String(lastT).slice(0, 10);
  const xl = (t) => (sameDay ? hhmm(t) + "Z" : String(t).slice(0, 10));

  el.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="combined net profit and loss with drawdown">` +
    `<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">` +
    `<stop offset="0%" stop-color="var(--brand)" stop-opacity=".13"/><stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>` +
    grid +
    `<line class="zeroline" x1="${PADL}" x2="${W - PADR}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"></line>` +
    perPaths +
    `<path d="${combPath} V${mainB} H${x(0).toFixed(1)} Z" fill="url(#gg)" stroke="none"></path>` +
    `<path d="${combPath}" fill="none" stroke="var(--ink)" stroke-width="2"></path>` +
    `<circle cx="${x(xs.length - 1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.4" fill="var(--brand)"></circle>` +
    `<text class="axis" x="${PADL - 8}" y="${(ddY(0) + 3).toFixed(1)}" text-anchor="end">0</text>` +
    `<text class="axis" x="${PADL - 8}" y="${(ddY(ddMin) + 3).toFixed(1)}" text-anchor="end">${fmt(ddMin, 0)}</text>` +
    `<line class="gridline" x1="${PADL}" x2="${W - PADR}" y1="${ddY(0).toFixed(1)}" y2="${ddY(0).toFixed(1)}"></line>` +
    `<path d="${ddPath}" fill="var(--down)" opacity=".3" stroke="none"></path>` +
    `<text class="axis" x="${W - PADR}" y="${(ddY(0) + 11).toFixed(1)}" text-anchor="end" opacity=".8">DRAWDOWN · worst ${money(ddWorst)}</text>` +
    `<text class="axis" x="${PADL}" y="${H - 8}">${sameDay ? String(first).slice(0, 10) + " " + xl(first) : xl(first)}</text>` +
    `<text class="axis" x="${W - PADR}" y="${H - 8}" text-anchor="end">${xl(lastT)}</text>` +
    `<line class="crosshair" id="fleetch" x1="0" x2="0" y1="${PADT}" y2="${H - PADB}" style="display:none"></line>` +
    `</svg>`;

  const svg = el.querySelector("svg");
  const ch = el.querySelector("#fleetch");
  const tip = document.createElement("div");
  tip.className = "tip"; tip.style.display = "none";
  el.appendChild(tip);
  svg.addEventListener("mousemove", (ev) => {
    const box = svg.getBoundingClientRect();
    const px = ((ev.clientX - box.left) / box.width) * W;
    let i = Math.round(((px - PADL) / (W - PADL - PADR)) * (xs.length - 1));
    i = Math.max(0, Math.min(xs.length - 1, i));
    ch.setAttribute("x1", x(i)); ch.setAttribute("x2", x(i)); ch.style.display = "";
    const rows = per.map((s) => {
      let lastv = 0;
      for (const p of s.pts) { if (p.t <= xs[i]) lastv = p.v; else break; }
      return `<div class="trow"><span><i style="background:${botColor(s.id)}"></i>${esc(s.id)}</span><span class="${cls(lastv)}">${signedMoney(lastv)}</span></div>`;
    }).join("");
    tip.innerHTML = `<div class="trow"><b>${esc(stampOf(xs[i]))}</b></div>` +
      `<div class="trow"><span>combined</span><b class="${cls(combined[i].v)}">${signedMoney(combined[i].v)}</b></div>` + rows;
    tip.style.display = "";
    const left = (x(i) / W) * box.width;
    tip.style.left = Math.min(Math.max(left - 90, 0), box.width - tip.offsetWidth - 4) + "px";
    tip.style.top = "10px";
  });
  svg.addEventListener("mouseleave", () => { ch.style.display = "none"; tip.style.display = "none"; });
}

function sparkSVG(series, kind, color) {
  let pts = (series || []).map(([, v]) => num(v)).filter(Number.isFinite);
  if (kind === "nav" && pts.length) { const b = pts[0]; pts = pts.map((v) => v - b); }
  if (pts.length < 2) {
    return '<svg viewBox="0 0 100 30" preserveAspectRatio="none"><line x1="4" y1="15" x2="96" y2="15" stroke="var(--line2)" stroke-width="1" stroke-dasharray="2 3"/></svg>';
  }
  const lo = Math.min(...pts, 0), hi = Math.max(...pts, 0.0001);
  const X = (i) => 3 + (i / (pts.length - 1)) * 94;
  const Y = (v) => 26 - ((v - lo) / (hi - lo || 1)) * 22;
  let d = "";
  pts.forEach((v, i) => { d += (i ? `H${X(i).toFixed(1)}V${Y(v).toFixed(1)}` : `M${X(0).toFixed(1)} ${Y(v).toFixed(1)}`); });
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none">` +
    `<line x1="3" x2="97" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>` +
    `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/>` +
    `<circle cx="${X(pts.length - 1).toFixed(1)}" cy="${Y(pts[pts.length - 1]).toFixed(1)}" r="2" fill="${color}"/></svg>`;
}

/* ── fleet page ────────────────────────────────────────────────────────── */
function renderFleet() {
  document.title = "TriggerTrader — Operations";
  const ov = model.overview || {};
  if (ov.available === false) {
    $("view").innerHTML =
      '<div class="banner"><div class="t">Registry unreachable</div><ul><li>' + esc(ov.reason || "") +
      "</li><li>Bring it up with <span class='num'>docker compose up -d</span>, then reload.</li></ul></div>";
    return;
  }
  const bots = ov.bots || [];
  const { combined, dd } = fleetSeries();
  const totalNet = combined.length ? combined[combined.length - 1].v : 0;
  const worstDD = dd.length ? Math.min(...dd.map((p) => p.v)) : 0;
  const liveCount = bots.filter((b) => b.enabled).length;
  const haltedCount = bots.filter((b) => b.status?.kill_switch === true || b.status?.halted).length;
  const lastAct = (ov.feed || [])[0];

  const m = money(totalNet), di = m.indexOf(".");
  const mWhole = di < 0 ? m : m.slice(0, di), mCents = di < 0 ? "00" : m.slice(di + 1);
  $("view").innerHTML = `
    <section class="card hero">
      <svg class="reticle-bg" viewBox="0 0 32 32" aria-hidden="true">
        <g stroke="var(--brand)" stroke-width="1" fill="none"><circle cx="16" cy="16" r="7.5"/>
        <path d="M16 1v7M16 24v7M1 16h7M24 16h7"/><circle cx="16" cy="16" r="12.5" opacity=".5"/></g>
      </svg>
      <div class="hero-top">
        <div>
          <div class="eyebrow">Fleet · net P&amp;L, all bots</div>
          <div class="hero-amount ${cls(totalNet)}">${esc(mWhole)}<span class="cents">.${esc(mCents)}</span></div>
          <div class="hero-delta u-dim">across ${bots.length} registered bot${bots.length === 1 ? "" : "s"} · each rebased to its own start</div>
        </div>
        <div class="hero-stats">
          <div><div class="k">Enabled</div><div class="v">${liveCount} of ${bots.length}</div></div>
          <div><div class="k">Halted</div><div class="v ${haltedCount ? "u-down" : ""}">${haltedCount}</div></div>
          <div><div class="k">Max drawdown</div><div class="v ${worstDD < 0 ? "u-down" : "u-mid"}">${money(worstDD)}</div></div>
          <div><div class="k">Last action</div><div class="v u-mid">${lastAct ? esc(hhmm(lastAct.at)) + "Z" : "—"}</div></div>
        </div>
      </div>
      <div class="chartwrap" id="fleetchart"></div>
      <div class="chartfoot">
        <div class="legend" id="fleetlegend"></div>
        <div class="range" id="fleetrange"></div>
      </div>
    </section>

    <div class="fleetgrid">
      <div class="botcards" id="botcards"></div>
      <section class="card">
        <header><span class="eyebrow">Activity</span><span class="sub">every bot, newest first</span></header>
        <div class="feed" id="fleetfeed"></div>
      </section>
    </div>`;

  $("fleetlegend").innerHTML = bots.filter((b) => (b.series || []).length).map((b) =>
    `<span class="chip ${model.hidden.has(b.bot_id) ? "off" : ""}" data-toggle="${esc(b.bot_id)}">` +
    `<i style="background:${botColor(b.bot_id)}"></i>${esc(b.bot_id)}</span>`).join("") ||
    '<span class="chartnote">series appear as bots record history</span>';
  $("fleetrange").innerHTML = ["1W", "1M", "ALL"].map((r) =>
    `<button data-range="${r}" class="${model.range === r ? "on" : ""}">${r}</button>`).join("");
  drawFleetChart($("fleetchart"));

  $("botcards").innerHTML = bots.map((b) => {
    const st = b.status || {};
    const color = botColor(b.bot_id);
    const halted = st.kill_switch === true || !!st.halted;
    const stale = st.contract === "botstate" && (st.heartbeat_age_seconds ?? 0) > 900;
    const pill = !b.enabled
      ? '<span class="pill">disabled</span>'
      : halted ? '<span class="pill down">halted</span>'
      : stale ? '<span class="pill warn">stale ' + esc(ago(st.heartbeat_age_seconds)) + "</span>"
      : '<span class="pill up">running</span>';
    let netVal = st.net_total;
    if (netVal == null && b.series_kind === "nav" && (b.series || []).length) {
      netVal = num(b.series[b.series.length - 1][1]) - num(b.series[0][1]);
    }
    const lastRun = st.last_run?.recorded_at;
    const countLabel = st.contract === "botstate" ? "Fills" : "Runs";
    const countVal = st.trades_total ?? (b.series || []).length;
    return `<a class="card botcard" href="#/bot/${encodeURIComponent(b.bot_id)}">
      <div class="head"><span class="dot" style="background:${color};box-shadow:none"></span>
        <span class="name">${esc(b.bot_id)}</span>${pill}</div>
      <div class="meta">${esc(b.display_name !== b.bot_id ? b.display_name + " · " : "")}${esc(b.asset_class)} · ${esc(b.cadence)}</div>
      <div class="spark">${sparkSVG(b.series, b.series_kind, color)}</div>
      <div class="vitals">
        <div><div class="k">Net</div><div class="v ${cls(netVal)}">${netVal == null ? "—" : signedMoney(netVal)}</div></div>
        <div><div class="k">${countLabel}</div><div class="v">${esc(String(countVal ?? "—"))}</div></div>
        <div><div class="k">Last</div><div class="v u-mid">${lastRun ? esc(stampOf(lastRun).slice(5, 16)) : st.heartbeat_age_seconds != null ? esc(ago(st.heartbeat_age_seconds)) + " ago" : "—"}</div></div>
      </div>
      <span class="open">OPEN CONSOLE →</span>
    </a>`;
  }).join("");

  $("fleetfeed").innerHTML = (ov.feed || []).length ? ov.feed.map((e) => {
    const bad = /halt|refus|partial|error/i.test(String(e.kind));
    return `<div class="row ${bad ? "bad" : ""}">
      <span class="at">${esc(stampOf(e.at).slice(5, 16))}</span>
      <span class="who"><i style="background:${botColor(e.bot_id)}"></i></span>
      <span class="what"><b>${esc(e.bot_id)}</b> · ${esc(e.text || e.kind || "")}</span>
    </div>`;
  }).join("") : '<div class="empty">Nothing has happened yet.</div>';
}

/* ── futures bot page (botstate contract) ──────────────────────────────── */
function renderFutures(id, d) {
  document.title = id + " — TriggerTrader";
  const st = d.state || {};
  const det = st.detail || {};
  const sleeves = det.sleeves || {};
  const hb = d.heartbeat_age_seconds;
  const word = botOf(id)?.status?.control_state;
  const halted = st.state === "halted" || word === "halted";
  const kill = det.kill || {};
  const killFrac = num(kill.limit) ? Math.min(Math.abs(num(kill.rolling_net) / num(kill.limit)), 1) : 0;

  $("view").innerHTML = `
    <div class="bothead">
      <a class="back" href="#/">← FLEET</a>
      <span class="dot" style="background:${botColor(id)};box-shadow:none"></span>
      <h1>${esc(id)}</h1>
      ${halted ? '<span class="pill down">halted</span>' : '<span class="pill up">' + esc(st.state || "—") + "</span>"}
      <span class="pill ${st.mode === "live" ? "down" : ""}">${esc(st.mode || "?")}</span>

  const rows = fills.slice(-60).reverse().map((f) => {
    const net = f.net ?? f.pnl;

    return `<tr>
      <td class="time">${esc(stampOf(f.at || f.ts || f.time).slice(5, 16))}</td>
      <td class="sym">${esc(f.sleeve || f.tag || "")}</td>
      <td class="${sideish.startsWith("b") || sideish === "long" ? "side-l" : "side-s"}">${esc(f.side || f.dir || "")}</td>
      <td class="num">${esc(String(f.qty ?? f.units ?? ""))}</td>
      <td class="num">${f.price != null ? fmt(f.price) : "—"}</td>
      <td class="num ${cls(net)}">${net != null ? signedMoney(net) : "—"}</td>

  return `<table><thead><tr><th>Time</th><th>Sleeve</th><th>Side</th>
    <th class="num">Qty</th><th class="num">Price</th><th class="num">Net</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function drawNavChart(el, runs) {
  const pts = (runs || []).slice().reverse()
    .filter((r) => r.nav != null)
    .map((r) => ({ t: r.recorded_at, v: num(r.nav) }))
    .filter((p) => Number.isFinite(p.v));
  if (pts.length < 2) {
    el.innerHTML = '<div class="empty">One run recorded — a curve needs two.</div>';
    return;
  }
  const W = Math.max(el.clientWidth || 860, 320);
  const H = 200, PADL = 60, PADR = 14, PADT = 12, PADB = 24;
  const [y0, y1, ticks] = niceScale(Math.min(...pts.map((p) => p.v)), Math.max(...pts.map((p) => p.v)), 5);
  const x = (i) => PADL + (i / (pts.length - 1)) * (W - PADL - PADR);
  const y = (v) => PADT + (1 - (v - y0) / (y1 - y0)) * (H - PADT - PADB);
  let d = "";
  pts.forEach((p, i) => { d += i ? `H${x(i).toFixed(1)}V${y(p.v).toFixed(1)}` : `M${x(0).toFixed(1)} ${y(p.v).toFixed(1)}`; });
  const grid = ticks.map((t) =>
    `<line class="gridline" x1="${PADL}" x2="${W - PADR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"></line>` +
    `<text class="axis" x="${PADL - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${fmt(t, 0)}</text>`).join("");
  const first = pts[0].t, last = pts[pts.length - 1].t;
  const sameDay = String(first).slice(0, 10) === String(last).slice(0, 10);
  const lbl = (t) => (sameDay ? hhmm(t) + "Z" : String(t).slice(0, 10));
  el.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="NAV per run">` +
    `<defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1">` +
    `<stop offset="0%" stop-color="var(--up)" stop-opacity=".16"/><stop offset="100%" stop-color="var(--up)" stop-opacity="0"/></linearGradient></defs>` +
    grid +
    `<path d="${d} V${H - PADB} H${x(0).toFixed(1)} Z" fill="url(#ng)"></path>` +
    `<path d="${d}" fill="none" stroke="var(--up)" stroke-width="1.8"></path>` +
    `<circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(pts[pts.length - 1].v).toFixed(1)}" r="3" fill="var(--up)"></circle>` +
    `<text class="axis" x="${PADL}" y="${H - 8}">${sameDay ? String(first).slice(0, 10) + " " + lbl(first) : lbl(first)}</text>` +
    `<text class="axis" x="${W - PADR}" y="${H - 8}" text-anchor="end">${lbl(last)}</text></svg>`;
}

function renderPositions(s) {
  const p = s.book.positions || [];
  $("poshint").textContent = p.length ? p.length + " open" : "";
  if (!p.length) { $("positions").innerHTML = '<div class="empty">Flat — nothing open.</div>'; return; }
  const peak = Math.max(...p.map((r) => Math.abs(num(r.weight)) || 0), 0.0001);
  $("positions").innerHTML = `<table><thead><tr><th>Symbol</th><th>Side</th><th>Exposure</th>
    <th class="num">Notional</th><th class="num">Qty</th><th class="num">Avg</th><th class="num">Mark</th>
    <th class="num">uPnL</th><th class="num">Weight</th></tr></thead><tbody>` +
    p.map((r) => {
      const w = num(r.weight);
      const width = Math.min((Math.abs(w) / peak) * 50, 50);
      return `<tr>
        <td class="sym">${esc(r.asset)}</td>
        <td class="${r.side === "long" ? "side-l" : "side-s"}">${r.side === "long" ? "L" : "S"}</td>
        <td><div class="expo"><i class="${w >= 0 ? "l" : "s"}" style="width:${width.toFixed(1)}%"></i></div></td>
        <td class="num">${r.notional ? fmt(Math.abs(num(r.notional)), 0) : "—"}</td>
        <td class="num u-dim">${esc(r.qty)}</td>
        <td class="num u-dim">${fmt(r.avg_price)}</td>
        <td class="num">${r.mark ? fmt(r.mark) : '<span class="u-dim">no mark</span>'}</td>
        <td class="num ${cls(r.unrealised_pnl)}">${r.unrealised_pnl ? signedMoney(r.unrealised_pnl) : "—"}</td>

    }).join("") + "</tbody></table>";
}

function renderRisk(s) {
  const run = (s.runs || []).find((r) => r.risk_checks && r.risk_checks.length);
  const el = $("risk"); const bars = [];
  if (run) {
    $("riskhint").textContent = "as measured " + stampOf(run.recorded_at).slice(5, 16);
    for (const c of run.risk_checks) {
      const v = Math.abs(num(c.value)), lim = Math.abs(num(c.limit));
      const frac = lim > 0 ? Math.min(v / lim, 1) : 0;
      const level = !c.passed || frac >= 0.95 ? "high" : frac >= 0.75 ? "mid" : "";
      bars.push(`<div class="meter ${level}"><div class="row">
        <span class="name">${esc(c.name.replace(/_/g, " "))}</span>
        <span class="val">${fmt(c.value, 2)} <span class="lim">/ ${fmt(c.limit, 2)}</span></span></div>
        <div class="track"><i style="width:${(frac * 100).toFixed(1)}%"></i></div>
        ${c.detail ? '<div class="foot">' + esc(c.detail) + "</div>" : ""}
        ${c.passed ? "" : '<div class="foot u-down">breached — the plan was rejected</div>'}</div>`);
    }
  } else { $("riskhint").textContent = ""; }
  const g = Math.abs(num(s.book.gross_exposure));
  if (s.book.gross_exposure !== "n/a") {
    bars.push(`<div class="meter ${g >= 1 ? "high" : g >= 0.9 ? "mid" : ""}"><div class="row">
      <span class="name">gross exposure now</span><span class="val">${pct(g)} <span class="lim">of NAV</span></span></div>
      <div class="track"><i style="width:${Math.min(g * 100, 100).toFixed(1)}%"></i></div></div>`);
  }
  el.innerHTML = bars.length ? bars.join("") : '<div class="empty">No run has carried a risk report yet.</div>';
}

function renderReconciliation(r) {
  const el = $("reconciliation");
  if (!r) { el.innerHTML = ""; return; }
  if (r.agrees) {
    el.innerHTML = `<section class="card"><header><span class="eyebrow">Reconciliation</span>
      <span class="sub u-up">agrees</span></header><div class="pad tight">
      <div class="u-dim" style="font-size:12.5px">Our order ledger and the venue agree on ${r.theirs.length}
      position(s), from ${r.ledger_entries} ledger entries.</div></div></section>`;
    return;
  }
  let detail = "";
  if (r.unknown_fills.length) {
    detail += '<div class="ctlnote u-down">Fills we never authorised:</div><table style="margin-top:6px"><tbody>' +
      r.unknown_fills.map((f) => `<tr><td class="sym" style="padding-left:0">${esc(f.asset)}</td>
        <td class="num">${esc(f.qty)}</td>
        <td class="ellipsis" title="${esc(f.client_order_id)}">${esc(f.client_order_id)}</td></tr>`).join("") +
      "</tbody></table>";
  }
  if (r.disagreements.length) {
    detail += '<table style="margin-top:8px"><thead><tr><th style="padding-left:0"></th>' +
      '<th class="num">Ours</th><th class="num">Venue</th></tr></thead><tbody>' +
      r.disagreements.map((d) => `<tr><td class="sym" style="padding-left:0">${esc(d.asset)}</td>
        <td class="num">${esc(d.ours)}</td><td class="num u-down">${esc(d.theirs)}</td></tr>`).join("") +
      "</tbody></table>";
  }
  el.innerHTML = `<section class="card alarm"><header><span class="eyebrow">Reconciliation</span>
    <span class="sub u-down">disagrees</span></header><div class="pad tight">${detail}` +
    (r.unadopted.length || r.unknown_fills.length
      ? '<p class="ctlnote">Check the account, then take it on — name and reason above, and:</p>' +
        (controlsEnabled
          ? '<div class="btnrow one" style="margin-top:8px">' +
            (r.unknown_fills.length
              ? '<button class="ctl kill" id="adopt-unknown">Adopt, accepting these fills</button>'
              : '<button class="ctl go" data-action="adopt">Adopt venue positions</button>') + "</div>"
          : '<pre class="cmd">bot --config &lt;file&gt; adopt --reason "..." --by you --confirm' +
            (r.unknown_fills.length ? " \\\n    --accept-unknown-fills" : "") + "</pre>")
      : '<p class="ctlnote">Drift is never auto-corrected. The next run refuses to trade until this agrees.</p>') +
    "</div></section>";
}

function renderHealth(h, c) {
  $("health").innerHTML =
    `<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
      <span class="dot ${h.ok ? "ok" : "bad"}"></span>
      <strong class="${h.ok ? "u-up" : "u-down"}" style="font-size:13px">${h.ok ? "OK" : "Needs attention"}</strong></div>
    <dl class="kv">
      <dt>Set by</dt><dd>${esc((c && c.set_by) || "—")}</dd>
      <dt>Last run</dt><dd>${esc(stampOf(h.last_run_at).slice(5, 16))}</dd>
      <dt>Outcome</dt><dd>${esc(h.last_run_outcome || "—")}</dd>
      <dt>Hours since</dt><dd>${h.hours_since_last_run == null ? "—" : h.hours_since_last_run}</dd>
    </dl>` +
    ((c && c.reason) ? '<p class="ctlnote">' + esc(c.reason) + "</p>" : "") +
    ((h.notes || []).length
      ? '<ul style="margin:9px 0 0;padding-left:16px">' +
        h.notes.map((n) => '<li style="font-size:11.5px;color:var(--ink2);margin-bottom:4px">' + esc(n) + "</li>").join("") + "</ul>"
      : "");
}

function renderExpectation(e, live) {
  const m = e && e.metrics;
  const el = $("expectation");
  if (!m) { el.innerHTML = '<div class="u-dim" style="font-size:12.5px">No backtest record loaded — pass --expectation.</div>'; return; }
  const days = live.days_live == null ? 0 : live.days_live;
  const row = (k, a, b) =>
    `<tr><td class="u-dim" style="padding-left:0">${esc(k)}</td>
     <td class="num u-dim">${esc(a)}</td>
     <td class="num${live.meaningful ? "" : " u-dim"}">${esc(b)}</td></tr>`;
  el.innerHTML =
    `<table><thead><tr><th style="padding-left:0"></th><th class="num">BT ${fmt(m.years, 1)}y</th>
     <th class="num">Live ${days}d</th></tr></thead><tbody>` +
    row("Return", pct(m.total_return), live.return_since_start == null ? "—" : pct(live.return_since_start)) +
    row("Sharpe", fmt(m.sharpe), live.sharpe == null ? "not yet" : fmt(live.sharpe)) +
    row("Max DD", pct(m.max_drawdown), live.max_drawdown == null ? "—" : pct(live.max_drawdown)) +
    "</tbody></table>" +
    '<p class="ctlnote">' + esc(live.note) + "</p>";
}

/* ── controls (local wrapped bot: runs the bot binary server-side) ─────── */
const ACTIONS = {
  "mode-paper": { path: "/api/mode/paper", verb: "Switch to paper",
    confirm: "Point the bot at the paper venue. Real positions are left exactly as they are." },
  "mode-live-readonly": { path: "/api/mode/live-readonly", verb: "Switch to live read-only",
    confirm: "Point the bot at the real account. Real balances and fills; every order refused." },
  "mode-live": { path: "/api/mode/live", verb: "Go LIVE", typed: "LIVE",
    confirm: "Point the bot at the real account WITH TRADING ENABLED. Scheduled runs will place real orders with real money." },
  halt: { path: "/api/halt", verb: "Halt", confirm: "Stop executing. Planning continues; nothing open is closed." },
  pause: { path: "/api/pause", verb: "Pause", confirm: "Only orders that reduce exposure go out from now on." },
  resume: { path: "/api/resume", verb: "Resume", confirm: "Grant trading authority again. The next scheduled run will trade." },
  flatten: { path: "/api/flatten", verb: "Flatten", typed: "FLATTEN",
    confirm: "Cancel every resting order and close EVERY open position at market, right now." },
  adopt: { path: "/api/adopt", verb: "Adopt",
    confirm: "Write the venue's current positions into our own record as an opening baseline." },
};
let controlsEnabled = false;

function renderControlAvailability(enabled) {
  controlsEnabled = !!enabled;
  document.querySelectorAll("#controls button[data-action], #modeseg button").forEach((b) => {
    b.disabled = !controlsEnabled || b.classList.contains("on");
  });
  const hint = $("controlhint");
  if (hint) hint.textContent = controlsEnabled ? "runs the bot" : "read-only";
}

const MODES = [["paper", "Paper", ""], ["live-readonly", "Live read-only", ""], ["live", "Live", "live"]];
function renderMode(s) {
  const m = s.mode; const seg = $("modeseg");
  if (!seg) return;
  if (!m) { seg.innerHTML = "<button disabled>unknown</button>"; $("modenote").textContent = ""; return; }
  document.querySelector("#controls").classList.toggle("livemode", !!m.real_money);
  seg.innerHTML = MODES.map(([id, label, extra]) =>
    `<button data-action="mode-${id}" class="${extra}${m.mode === id ? " on" : ""}" ${m.mode === id ? "disabled" : ""}>${label}</button>`).join("");
  const feed = m.feed === "file" ? "static prices from marks.json" : "live prices from the venue";
  $("modenote").innerHTML = m.real_money
    ? `<span class="u-down"><b>Real money.</b> Scheduled runs place real orders.</span> Fills at ${esc(feed)}.`
    : (m.mode === "live-readonly"
      ? "Reading the real account; every order refused."
      : `Simulated fills at ${esc(feed)}.` +
        (m.feed === "file" ? ' <span class="u-warn">Frozen prices measure nothing.</span>' : ""));
}

async function sendControl(name, extra) {
  const spec = ACTIONS[name];
  if (!spec || !controlsEnabled) return;
  const by = $("who")?.value.trim(), reason = $("why")?.value.trim();
  const out = $("ctlresult");
  if (!by || !reason) {
    out.innerHTML = '<span class="u-down">A name and a reason are both required.</span>';
    $(by ? "why" : "who").focus(); return;
  }
  if (!window.confirm(spec.verb + "?\n\n" + spec.confirm + "\n\nReason: " + reason)) return;
  if (spec.typed && window.prompt("Type " + spec.typed + " to confirm.") !== spec.typed) {
    out.innerHTML = '<span class="u-dim">Cancelled.</span>'; return;
  }
  out.innerHTML = '<span class="u-dim">running ' + esc(spec.verb.toLowerCase()) + "…</span>";
  try {
    const res = await fetch(extra || spec.path, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ by, reason }),
    });
    const data = await res.json();
    if (!res.ok || data.ok === false) {
      out.innerHTML = '<span class="u-down">' + esc(data.error || "HTTP " + res.status) + "</span>" +
        (data.command ? "<pre class='cmd'>" + esc(data.command) + "</pre>" : "");
      return;
    }
    const rec = data.record || {};
    out.innerHTML = '<span class="u-up">' + esc(spec.verb) + " done" +
      (rec.outcome ? " · " + esc(rec.outcome) : "") + ".</span>" +
      (rec.detail ? '<p class="ctlnote">' + esc(rec.detail) + "</p>" : "");
    navigate();
  } catch (e) { out.innerHTML = '<span class="u-down">' + esc(e.message) + "</span>"; }
}

/* Fleet-level halt/resume: appends a control word to the registry, which every
   bot reads at its own gates. */
async function fleetControl(id, halt) {
  const by = $("who")?.value.trim(), reason = $("why")?.value.trim();
  const out = $("ctlresult");
  if (!by || !reason) {
    out.innerHTML = '<span class="u-down">A name and a reason are both required.</span>';
    $(by ? "why" : "who").focus(); return;
  }
  if (!window.confirm((halt ? "Halt " : "Resume ") + id + "?\n\nReason: " + reason)) return;
  out.innerHTML = '<span class="u-dim">writing control word…</span>';
  try {
    const res = await fetch("/api/bots/" + encodeURIComponent(id) + (halt ? "/halt" : "/resume"), {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ by, reason }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
    out.innerHTML = '<span class="u-up">' + (halt ? "Halted." : "Resumed.") + "</span>";
    navigate();
  } catch (e) { out.innerHTML = '<span class="u-down">' + esc(e.message) + "</span>"; }
}

/* ── one delegated listener: panels re-render ──────────────────────────── */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button, .chip");
  if (!t) return;
  if (t.id === "adopt-unknown") { sendControl("adopt", "/api/adopt-accepting-unknown-fills"); return; }
  if (t.dataset.action) { sendControl(t.dataset.action); return; }
  if (t.dataset.fleetHalt) { fleetControl(t.dataset.fleetHalt, true); return; }
  if (t.dataset.fleetResume) { fleetControl(t.dataset.fleetResume, false); return; }
  if (t.dataset.range) { model.range = t.dataset.range; renderFleet(); return; }
  if (t.dataset.toggle) {
    const id = t.dataset.toggle;
    if (model.hidden.has(id)) model.hidden.delete(id); else model.hidden.add(id);
    renderFleet(); return;
  }
});

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => render(), 160);
});

navigate();
setInterval(async () => {
  // Refresh in place — but never yank a form out from under someone typing.
  const active = document.activeElement;
  if (active && active.tagName === "INPUT" && active.value) return;
  await refreshData();
  render();
}, 10000);
</script>
